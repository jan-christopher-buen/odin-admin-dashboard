<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <aside class="sidebar">
        <div class="logo">
            <i class="mdi mdi-view-dashboard"></i>
            <span>Dashboard</span>
        </div>

        <nav>
            <ul class="nav-list">
                <li><a href="#"><i class="mdi mdi-home"></i>Home</a></li>
                <li><a href="#"><i class="mdi mdi-card-account-details"></i>Profile</a></li>
                <li><a href="#"><i class="mdi mdi-message-text"></i>Messages</a></li>
                <li><a href="#"><i class="mdi mdi-history"></i>History</a></li>
                <li><a href="#"><i class="mdi mdi-file-document-multiple"></i>Tasks</a></li>
                <li><a href="#"><i class="mdi mdi-account-group"></i>Communities</a></li>
            </ul>

            <ul class="nav-list">
                <li><a href="#"><i class="mdi mdi-cog"></i>Settings</a></li>
                <li><a href="#"><i class="mdi mdi-help-box"></i>Support</a></li>
                <li><a href="#"><i class="mdi mdi-shield-check"></i>Privacy</a></li>
            </ul>
        </nav>
    </aside>
    <header class="header">
        <div class="header-top">
            <div class="search">
                <i class="mdi mdi-magnify"></i>
                <input type="search" aria-label="Search">
            </div>
            <div class="user">
                <i class="mdi mdi-bell-outline"></i>
                <div class="avatar avatar-small">MO</div>
                <span>Morgan Oakley</span>
            </div>
        </div>

        <div class="header-bottom">
            <div class="greeting">
                <div class="avatar avatar-large">MO</div>
                <div>
                    <p class="greeting-small">Hi there,</p>
                    <p class="greeting-name">Morgan Oakley (@morgan)</p>
                </div>
            </div>
            <div class="header-buttons">
                <button>New</button>
                <button>Upload</button>
                <button>Share</button>
            </div>
        </div>
    </header>
    <main class="main">Main</main>

</body>

</html>
